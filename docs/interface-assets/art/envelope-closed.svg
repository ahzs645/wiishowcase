<svg xmlns="http://www.w3.org/2000/svg" width="576" height="384" viewBox="0 0 576 384" role="img" aria-label="Soft yellow Wii style envelope with folded flap and shadows">
  <defs>
    <clipPath id="inside">
      <rect x="4" y="4" width="568" height="376" />
    </clipPath>

    <linearGradient id="paperBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffe9" />
      <stop offset="0.12" stop-color="#fffbd0" />
      <stop offset="0.72" stop-color="#fff9bd" />
      <stop offset="1" stop-color="#f4e9aa" />
    </linearGradient>

    <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbd0" />
      <stop offset="0.35" stop-color="#fffabe" />
      <stop offset="0.84" stop-color="#fff9bd" />
      <stop offset="1" stop-color="#f7ecad" />
    </linearGradient>

    <linearGradient id="flapFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffee" />
      <stop offset="0.06" stop-color="#fffedc" />
      <stop offset="0.20" stop-color="#fffac2" />
      <stop offset="0.74" stop-color="#fff8bc" />
      <stop offset="1" stop-color="#f6e9aa" />
    </linearGradient>

    <radialGradient id="softCenter" cx="50%" cy="9%" r="76%">
      <stop offset="0" stop-color="#fffff1" stop-opacity="0.28" />
      <stop offset="0.45" stop-color="#fff7bc" stop-opacity="0.07" />
      <stop offset="1" stop-color="#fff7bc" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rightShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b79a58" stop-opacity="0" />
      <stop offset="0.58" stop-color="#b79a58" stop-opacity="0.07" />
      <stop offset="1" stop-color="#a88d54" stop-opacity="0.20" />
    </linearGradient>

    <linearGradient id="leftGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b89f57" stop-opacity="0" />
      <stop offset="0.72" stop-color="#b89f57" stop-opacity="0.10" />
      <stop offset="1" stop-color="#a88f55" stop-opacity="0.23" />
    </linearGradient>

    <filter id="blur4" x="-8%" y="-35%" width="116%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" />
    </filter>

    <filter id="blur8" x="-8%" y="-35%" width="116%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="flapDrop" x="-8%" y="-25%" width="116%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.3" result="soft" />
      <feOffset in="soft" dx="0" dy="3" result="offset" />
      <feFlood flood-color="#b57648" flood-opacity="0.28" result="color" />
      <feComposite in="color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
      </feMerge>
    </filter>

    <filter id="logoSoft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="0.35" flood-color="#bf9d4f" flood-opacity="0.22" />
    </filter>

    <path id="crease" d="M 4 64 L 250 213 C 266 222 276 229 288 229 C 301 229 313 222 324 215 L 572 58" />
    <path id="topFlap" d="M 4 4 H 572 V 58 L 324 215 C 313 222 301 229 288 229 C 276 229 266 222 250 213 L 4 64 Z" />
    <path id="lowerBody" d="M 4 64 L 250 213 C 266 222 276 229 288 229 C 301 229 313 222 324 215 L 572 58 V 380 H 4 Z" />
  </defs>

  
  <g clip-path="url(#inside)">
    
    <rect x="4" y="4" width="568" height="376" fill="url(#paperBase)" />
    <rect x="4" y="4" width="568" height="376" fill="url(#softCenter)" />

    
    <use href="#lowerBody" fill="url(#bodyFill)" />
    <rect x="4" y="4" width="54" height="376" fill="url(#leftGlow)" opacity="0.62" />
    <rect x="512" y="4" width="60" height="376" fill="url(#rightShade)" />
    <rect x="4" y="334" width="568" height="46" fill="url(#bottomShade)" />
    <ellipse cx="288" cy="381" rx="292" ry="26" fill="#b69a54" opacity="0.10" filter="url(#blur8)" />

    
    <use href="#crease" fill="none" stroke="#b77a4c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.06" filter="url(#blur4)" />
    <use href="#crease" fill="none" stroke="#c98a5a" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.06" filter="url(#blur4)" transform="translate(0 2)" />
    <ellipse cx="288" cy="229" rx="58" ry="12" fill="#b8794b" opacity="0.04" filter="url(#blur4)" />

    
    <use href="#topFlap" fill="url(#flapFill)" />
    <use href="#topFlap" fill="url(#softCenter)" opacity="0.20" />

    
    <use href="#crease" fill="none" stroke="#e6c29c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.22" transform="translate(0 -0.7)" />
    <use href="#crease" fill="none" stroke="#d09b72" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.12" />
    <use href="#crease" fill="none" stroke="#fff4c8" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round" opacity="0.24" transform="translate(0 -1.6)" />

    
    <rect x="7" y="4" width="555" height="3" fill="#ffffff" opacity="0.48" />
    <rect x="4" y="4" width="568" height="376" fill="none" stroke="#ead9c5" stroke-width="1" opacity="0.25" />
    <rect x="7" y="7" width="562" height="370" fill="none" stroke="#ffffdc" stroke-width="1" opacity="0.30" />
  </g>

  
  <g filter="url(#logoSoft)" opacity="0.92">
    <text x="244" y="190" font-family="Arial Rounded MT Bold, Trebuchet MS, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-3" fill="#d4b263">Wii</text>
    <text x="326" y="190" font-family="Arial, sans-serif" font-size="5.5" font-weight="700" fill="#d4b263">TM</text>
  </g>
</svg>